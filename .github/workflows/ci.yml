name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Stage the pinned stock Telegram server for offline tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/sandbox/fetch-stock.sh --pinned "$RUNNER_TEMP/stock-server.ts"
          printf 'TELEBOTS_STOCK_SERVER_SOURCE=%s\n' "$RUNNER_TEMP/stock-server.ts" >> "$GITHUB_ENV"
      - name: Run local static and unit checks in a scrubbed home
        env:
          TELEBOTS_SANDBOX_BASE: ${{ runner.temp }}/telebots-unit
        run: bash tests/run.sh --unit-only

  macos-sandbox:
    name: macOS shell engines and sandbox
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Stage the pinned stock Telegram server for offline tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/sandbox/fetch-stock.sh --pinned "$RUNNER_TEMP/stock-server.ts"
          printf 'TELEBOTS_STOCK_SERVER_SOURCE=%s\n' "$RUNNER_TEMP/stock-server.ts" >> "$GITHUB_ENV"
      - name: Shell engines and unit checks
        env:
          TELEBOTS_SANDBOX_BASE: ${{ runner.temp }}/telebots-unit
        run: bash tests/run.sh --static-only
      - name: Run all 21 sandbox scenarios twice
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/telebots-scenarios"
          if [ -f poller/telebots.ts ] && [ -f engine/fleet-add-bot ] && \
             [ -f plugin/hooks/telebots-rules.sh ] && [ -d tests/ops ]; then
            bash tests/sandbox/run.sh --base "$base" --real-home "$HOME" \
              --main-checkout "$GITHUB_WORKSPACE" --stock-server "$RUNNER_TEMP/stock-server.ts"
          elif [ "$GITHUB_REF_NAME" = main ]; then
            echo "Required integration packages are missing on main." >&2
            exit 1
          else
            bash tests/sandbox/run.sh --base "$base" --real-home "$HOME" \
              --main-checkout "$GITHUB_WORKSPACE" --phase1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
