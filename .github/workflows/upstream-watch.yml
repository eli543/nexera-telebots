name: Upstream Telegram plugin watch

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream server.ts with the supported pin
        shell: bash
        run: |
          set -euo pipefail
          bash tests/sandbox/fetch-stock.sh --watch "$RUNNER_TEMP/stock-server.ts"
